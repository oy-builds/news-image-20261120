<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>THE WORLD IN ONE IMAGE — FRIDAY · 20 NOVEMBER 2026</title>
<desc>Russian strikes hit Kyiv — missiles spill into Poland | World Court: Myanmar committed genocide against Rohingya | Britain and the EU seal a Brexit-reset deal package | AI sell-off drags world markets sharply down | Magnitude 6.7 earthquake hits central Peru | On World Children&apos;s Day, UN warns of children in crisis</desc>
<style>
  .mast{font:900 74px Arial,Helvetica,sans-serif;fill:#fff;letter-spacing:1px}
  .datelab{font:700 30px Arial,Helvetica,sans-serif;fill:#fbbf24;letter-spacing:4px}
