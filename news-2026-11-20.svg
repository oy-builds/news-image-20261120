<path d="M1428 86 H1532 M1480 34 V138" stroke="#475569" stroke-width="3"/>
<text x="48" y="72" class="datelab">FRIDAY · 20 NOVEMBER 2026</text>
<text x="48" y="152" class="mast">THE WORLD IN ONE IMAGE</text>
<text x="48" y="196" class="sub">Six stories that shaped the day — diplomacy, justice, markets and disaster</text>
<g>
  <rect x="48" y="252" width="736" height="262" rx="18" fill="#ffffff" opacity="0.97"/>
  <rect x="48" y="252" width="736" height="10" rx="5" fill="#f59e0b"/>
  <text x="76" y="300" class="cat" fill="#f59e0b">CONFLICT · EUROPE</text>
  <text x="756" y="300" class="place">Kyiv &amp; Poland</text>
  <g transform="translate(74,310) scale(0.72)"><g stroke="#f59e0b" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M5 78 Q50 20 95 78"/><path d="M5 78 H95"/><path d="M25 62 V78 M50 50 V78 M75 62 V78"/>
      <g fill="#f59e0b" stroke="none"><path d="M78 8 l3 7 7 1 -5 5 1 7 -6-3 -6 3 1-7 -5-5 7-1z"/></g></g></g>
  <text x="160" y="344" class="num" fill="#f59e0b">01</text>
  <text x="76" y="370" class="head">Russian strikes hit Kyiv —</text>
<text x="76" y="406" class="head">missiles spill into Poland</text>
  <text x="76" y="458" class="t">Russia launched a major overnight attack on Kyiv;</text>
<text x="76" y="485" class="t">missiles and a suspected drone came down in Poland,</text>
<text x="76" y="512" class="t">drawing a NATO airspace protest.</text>
</g>
<g>
  <rect x="816" y="252" width="736" height="262" rx="18" fill="#ffffff" opacity="0.97"/>
  <rect x="816" y="252" width="736" height="10" rx="5" fill="#38bdf8"/>
  <text x="844" y="300" class="cat" fill="#38bdf8">JUSTICE · THE HAGUE</text>
  <text x="1524" y="300" class="place">The Hague</text>
  <g transform="translate(842,310) scale(0.72)"><g stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M50 12 V78 M28 84 H72 M50 22 H22 M50 22 H78"/>
      <path d="M22 22 L12 44 M22 22 L32 44 M12 44 Q22 54 32 44"/>
      <path d="M78 22 L68 44 M78 22 L88 44 M68 44 Q78 54 88 44"/></g></g>
  <text x="928" y="344" class="num" fill="#38bdf8">02</text>
  <text x="844" y="370" class="head">World Court: Myanmar committed</text>
<text x="844" y="406" class="head">genocide against Rohingya</text>
  <text x="844" y="458" class="t">The International Court of Justice ruled Myanmar&apos;s</text>
<text x="844" y="485" class="t">security forces committed state-sponsored genocide</text>
<text x="844" y="512" class="t">against the Rohingya minority.</text>
</g>
<g>
  <rect x="48" y="534" width="736" height="262" rx="18" fill="#ffffff" opacity="0.97"/>
  <rect x="48" y="534" width="736" height="10" rx="5" fill="#a78bfa"/>
  <text x="76" y="582" class="cat" fill="#a78bfa">DIPLOMACY · BRUSSELS</text>
  <text x="756" y="582" class="place">Brussels</text>
  <g transform="translate(74,592) scale(0.72)"><g stroke-linecap="round">
      <rect x="10" y="18" width="36" height="26" rx="4" fill="#2563eb"/>
      <rect x="54" y="18" width="36" height="26" rx="4" fill="#a78bfa"/>
      <g stroke="#fff" stroke-width="5" fill="none"><path d="M28 56 V86 M72 56 V86"/><path d="M28 70 H72"/></g>
      <circle cx="50" cy="70" r="6" fill="#fff"/></g></g>
  <text x="160" y="626" class="num" fill="#a78bfa">03</text>
  <text x="76" y="652" class="head">Britain and the EU seal a</text>
<text x="76" y="688" class="head">Brexit-reset deal package</text>
  <text x="76" y="740" class="t">London and Brussels signed deals on food trade,</text>
<text x="76" y="767" class="t">carbon markets and youth mobility at their summit —</text>
<text x="76" y="794" class="t">the closest ties since Brexit.</text>
</g>
<g>
  <rect x="816" y="534" width="736" height="262" rx="18" fill="#ffffff" opacity="0.97"/>
  <rect x="816" y="534" width="736" height="10" rx="5" fill="#fb7185"/>
  <text x="844" y="582" class="cat" fill="#fb7185">ECONOMY · GLOBAL MARKETS</text>
  <text x="1524" y="582" class="place">New York &amp; Tokyo</text>
  <g transform="translate(842,592) scale(0.72)"><g stroke="#fb7185" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 14 V90 H92"/><path d="M18 30 L42 46 L58 38 L86 74"/><path d="M86 74 l-14 -2 M86 74 l-1 -14"/></g></g>
  <text x="928" y="626" class="num" fill="#fb7185">04</text>
  <text x="844" y="652" class="head">AI sell-off drags world markets</text>
<text x="844" y="688" class="head">sharply down</text>
  <text x="844" y="740" class="t">Worries over AI spending hit stocks worldwide: the</text>
<text x="844" y="767" class="t">S&amp;P 500 fell about 3.7% into correction and Japan&apos;s</text>
<text x="844" y="794" class="t">Nikkei dropped 5.06%, as reported.</text>
</g>
<g>
  <rect x="48" y="816" width="736" height="262" rx="18" fill="#ffffff" opacity="0.97"/>
  <rect x="48" y="816" width="736" height="10" rx="5" fill="#34d399"/>
  <text x="76" y="864" class="cat" fill="#34d399">DISASTER · PERU</text>
  <text x="756" y="864" class="place">Cerro de Pasco, Peru</text>
  <g transform="translate(74,874) scale(0.72)"><g stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 82 L34 40 L50 62 L64 34 L92 82 Z"/>
      <path d="M50 62 l-6 10 10 4 -8 8"/></g>
      <g stroke="#34d399" stroke-width="4" fill="none" opacity="0.65"><path d="M14 22 q6 6 0 12 M86 22 q-6 6 0 12"/></g></g>
  <text x="160" y="908" class="num" fill="#34d399">05</text>
  <text x="76" y="934" class="head">Magnitude 6.7 earthquake hits</text>
<text x="76" y="970" class="head">central Peru</text>
  <text x="76" y="1022" class="t">A magnitude 6.7 earthquake struck central Peru near</text>
<text x="76" y="1049" class="t">Cerro de Pasco, listed among the day&apos;s top disaster</text>
<text x="76" y="1076" class="t">stories.</text>
</g>
<g>
  <rect x="816" y="816" width="736" height="262" rx="18" fill="#ffffff" opacity="0.97"/>
  <rect x="816" y="816" width="736" height="10" rx="5" fill="#facc15"/>
  <text x="844" y="864" class="cat" fill="#facc15">SOCIETY · WORLD CHILDREN&apos;S DAY</text>
  <text x="1524" y="864" class="place">Ukraine, Afghanistan &amp; Kenya</text>
  <g transform="translate(842,874) scale(0.72)"><g stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="50" cy="42" r="16" fill="#facc15" stroke="none"/>
      <path d="M50 12 V20 M50 64 V72 M20 42 H28 M72 42 H80 M29 21 L35 27 M65 57 L71 63 M71 21 L65 27 M35 57 L29 63"/>
      <path d="M18 90 Q34 78 50 90 Q66 102 82 90"/></g></g>
  <text x="928" y="908" class="num" fill="#facc15">06</text>
  <text x="844" y="934" class="head">On World Children&apos;s Day, UN warns</text>
<text x="844" y="970" class="head">of children in crisis</text>
  <text x="844" y="1022" class="t">UN News marked 20 November with Ukraine&apos;s deadliest</text>
<text x="844" y="1049" class="t">year for children, Afghan women blocked from medical</text>
<text x="844" y="1076" class="t">help, and a push for Africa&apos;s youth.</text>
</g>
<text x="48" y="1136" class="note">Stories are drawn from the sources listed per item, as reported on 20 November 2026. Market and quake figures are as reported by the cited source and may be revised.</text>
<text x="48" y="1170" class="foot">Sources: UN News · One Turn News · Open Chronicle Global News Brief · Hansen Intel (PBS / Guardian reporting) — all 20 Nov 2026. Full URLs in data/stories.json</text>
